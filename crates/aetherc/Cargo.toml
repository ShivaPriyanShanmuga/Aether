[package]
name = "aetherc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Command-line driver for the Aether compiler platform."

# The default binary target (`src/main.rs`) is named after the package. CLI
# argument parsing remains hand-rolled for now; see TECH_DEBT.md for the planned
# migration to `clap` once the CLI surface grows.

[dependencies]
aether-source = { path = "../aether-source" }
aether-diagnostics = { path = "../aether-diagnostics" }
aether-lexer = { path = "../aether-lexer" }
aether-ast = { path = "../aether-ast" }
aether-parser = { path = "../aether-parser" }
aether-air = { path = "../aether-air" }
aether-lower = { path = "../aether-lower" }
aether-air-interp = { path = "../aether-air-interp" }

[lints]
workspace = true
